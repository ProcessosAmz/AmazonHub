http:
  routers:
    frontend-api:
      rule: "PathPrefix(`/api`)"
      entryPoints:
        - frontend
      service: backend
      priority: 100
    frontend:
      rule: "PathPrefix(`/`)"
      entryPoints:
        - frontend
      service: frontend
      priority: 1
  services:
    frontend:
      loadBalancer:
        healthCheck:
          path: /health
          interval: "5s"
          timeout: "3s"
        servers:
          - url: "http://komissx_frontend_blue:80"
    backend:
      loadBalancer:
        healthCheck:
          path: /api/health/live
          interval: "5s"
          timeout: "3s"
        servers:
          - url: "http://komissx_backend_blue:3000"
